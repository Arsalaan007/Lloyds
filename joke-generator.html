<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .joke-box {
            background: #f8f9fa;
            border-left: 5px solid #667eea;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .joke-text {
            color: #333;
            font-size: 1.2em;
            line-height: 1.6;
            font-weight: 500;
        }

        .loading {
            color: #667eea;
            font-style: italic;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
            margin: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .error {
            color: #dc3545;
            background: #f8d7da;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .joke-category {
            color: #667eea;
            font-size: 0.9em;
            margin-top: 15px;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 1.8em;
            }

            .joke-text {
                font-size: 1em;
            }

            button {
                padding: 12px 30px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>😂 Joke Generator</h1>
        
        <div id="errorMessage" class="error" style="display: none;"></div>
        
        <div class="joke-box">
            <div class="joke-text" id="jokeText">Click a button to get a joke!</div>
        </div>

        <div class="joke-category" id="jokeCategory"></div>

        <div class="button-group">
            <button onclick="getRandomJoke()">Random Joke</button>
            <button onclick="getProgrammingJoke()">Programming</button>
            <button onclick="getKnockKnockJoke()">Knock Knock</button>
        </div>
    </div>

    <script>
        // Hide error message after 5 seconds
        function hideError() {
            const errorDiv = document.getElementById('errorMessage');
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        // Display error message
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            hideError();
        }

        // Fetch random joke from API
        async function getRandomJoke() {
            const jokeText = document.getElementById('jokeText');
            const jokeCategory = document.getElementById('jokeCategory');
            
            jokeText.textContent = 'Loading...';
            jokeText.classList.add('loading');
            jokeCategory.textContent = '';

            try {
                const response = await fetch('https://official-joke-api.appspot.com/random_joke');
                
                if (!response.ok) {
                    throw new Error('Failed to fetch joke');
                }

                const data = await response.json();
                jokeText.classList.remove('loading');
                jokeText.textContent = `${data.setup} ... ${data.punchline}`;
                jokeCategory.textContent = `Category: ${data.type}`;
                
            } catch (error) {
                jokeText.classList.remove('loading');
                showError('Unable to fetch joke. Please try again!');
                console.error('Error:', error);
            }
        }

        // Fetch programming joke
        async function getProgrammingJoke() {
            const jokeText = document.getElementById('jokeText');
            const jokeCategory = document.getElementById('jokeCategory');
            
            jokeText.textContent = 'Loading...';
            jokeText.classList.add('loading');
            jokeCategory.textContent = '';

            try {
                const response = await fetch('https://official-joke-api.appspot.com/jokes/programming/random');
                
                if (!response.ok) {
                    throw new Error('Failed to fetch programming joke');
                }

                const data = await response.json();
                // API returns array, get first item if needed
                const joke = Array.isArray(data) ? data[0] : data;
                
                jokeText.classList.remove('loading');
                jokeText.textContent = `${joke.setup} ... ${joke.punchline}`;
                jokeCategory.textContent = `Category: ${joke.type}`;
                
            } catch (error) {
                jokeText.classList.remove('loading');
                showError('Unable to fetch programming joke. Please try again!');
                console.error('Error:', error);
            }
        }

        // Fetch knock-knock joke
        async function getKnockKnockJoke() {
            const jokeText = document.getElementById('jokeText');
            const jokeCategory = document.getElementById('jokeCategory');
            
            jokeText.textContent = 'Loading...';
            jokeText.classList.add('loading');
            jokeCategory.textContent = '';

            try {
                const response = await fetch('https://official-joke-api.appspot.com/jokes/knock-knock/random');
                
                if (!response.ok) {
                    throw new Error('Failed to fetch knock-knock joke');
                }

                const data = await response.json();
                // API returns array, get first item if needed
                const joke = Array.isArray(data) ? data[0] : data;
                
                jokeText.classList.remove('loading');
                jokeText.textContent = `${joke.setup} ... ${joke.punchline}`;
                jokeCategory.textContent = `Category: ${joke.type}`;
                
            } catch (error) {
                jokeText.classList.remove('loading');
                showError('Unable to fetch knock-knock joke. Please try again!');
                console.error('Error:', error);
            }
        }

        // Load a joke on page load
        window.addEventListener('load', getRandomJoke);
    </script>
</body>
</html>
